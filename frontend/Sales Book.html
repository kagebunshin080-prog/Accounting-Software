<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<script src="config.js"></script>

<style>
@page { margin: 20mm; }

body {
  font-family: "Times New Roman", serif;
  font-size: 14px;
}

.title {
  text-align: center;
  font-weight: bold;
  font-size: 18px;
  margin-bottom: 10px;
}

.section-box {
  border: 1px solid black;
  padding: 10px;
  margin-bottom: 12px;
}

.section-title {
  font-weight: bold;
  margin-bottom: 6px;
  text-decoration: underline;
}

label {
  margin-right: 15px;
}

input {
  padding: 4px;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 8px;
}

th, td {
  border: 1px solid black;
  padding: 6px;
}

th {
  background: #f2f2f2;
}

.center { text-align: center; }
.amount { text-align: right; }

/* 🔽 AUTOCOMPLETE DROPDOWN */
#suggestions {
  position: absolute;
  background: white;
  border: 1px solid #aaa;
  max-height: 150px;
  overflow-y: auto;
  z-index: 9999;
  width: 260px;
}

#suggestions div {
  padding: 6px;
  cursor: pointer;
}

#suggestions div:hover {
  background: #f0f0f0;
}
</style>
</head>

<body>

<div class="title">Sales Book of "Entity Name"</div>

<!--1️⃣ INVOICE HEADER -->
<div class="section-box">
  <div class="section-title">Invoice Details</div>

  <label>Date:
    <input type="date" id="saleDate">
  </label>

  <label>Customer:
    <input type="text" id="customer" placeholder="Customer Name">
  </label>

  <label>Invoice No:
    <input type="text" id="invoiceNo" readonly>
  </label>
</div>

<!-- 2️⃣ ADD ITEM -->
<div class="section-box">
  <div class="section-title">Add Item</div>

  <label>Description:
    <input type="text" id="itemSearch" placeholder="Search item">
    <div id="suggestions"></div>
  </label>

  <label>Qty:
    <input type="number" id="itemQty" value="1">
  </label>

  <label>Rate ₹:
    <input type="number" id="itemRate" step="0.01">
  </label>

  <button onclick="addItem()">Add Item</button>
</div>

<!-- 3️⃣ ITEM LIST -->
<div class="section-box">
  <div class="section-title">Items</div>

  <table id="itemsTable">
    <tr>
      <th>Description</th>
      <th>Qty</th>
      <th>Rate</th>
      <th>Amount</th>
    </tr>
  </table>
</div>

<!-- 4️⃣ SAVE -->
<div class="section-box">
  <button onclick="addSale()">Save Sales Invoice</button>
</div>

<script>
/* =====================
   GLOBAL STATE
===================== */
let items = [];
let selectedItem = null;

const searchInput = document.getElementById("itemSearch");
const suggestionsBox = document.getElementById("suggestions");

/* =====================
   LOAD INVOICE NUMBER
===================== */
function loadNextInvoice() {
  fetch(API_BASE_URL + "/sales/next-invoice")
    .then(res => res.json())
    .then(data => invoiceNo.value = data.invoiceNo)
    .catch(() => alert("Unable to load invoice number"));
}
loadNextInvoice();

/* =====================
   AUTOCOMPLETE SEARCH
===================== */
searchInput.addEventListener("input", async () => {
  selectedItem = null;
  suggestionsBox.innerHTML = "";

  const q = searchInput.value.trim();
  if (q.length < 2) return;

  try {
    const res = await fetch(API_BASE_URL + `/items/search?q=${encodeURIComponent(q)}`);
    const list = await res.json();

    list.forEach(item => {
      const div = document.createElement("div");
      div.textContent = `${item.item_name} (₹${item.selling_price})`;

      div.onclick = () => {
        selectedItem = item;
        searchInput.value = item.item_name;
        itemRate.value = item.selling_price;
        suggestionsBox.innerHTML = "";
      };

      suggestionsBox.appendChild(div);
    });
  } catch (err) {
    console.error(err);
  }
});

/* =====================
   STOCK CHECK
===================== */
async function getAvailableStock(itemId) {
  const res = await fetch(API_BASE_URL + `/stock/${itemId}`);
  const data = await res.json();
  return data.available;
}

/* =====================
   ADD ITEM
===================== */
async function addItem() {
  if (!selectedItem) {
    alert("Please select an item from dropdown");
    return;
  }

  const qty = Number(itemQty.value);
  const rate = Number(itemRate.value);

  if (qty <= 0 || rate <= 0) {
    alert("Invalid quantity or rate");
    return;
  }

  const available = await getAvailableStock(selectedItem.id);
  if (qty > available) {
    alert(`Insufficient stock\nAvailable: ${available}`);
    return;
  }

  const amount = qty * rate;

  items.push({
    item_id: selectedItem.id,
    description: selectedItem.item_name,
    qty,
    rate,
    amount
  });

  const row = itemsTable.insertRow();
  row.innerHTML = `
    <td>${selectedItem.item_name}</td>
    <td class="center">${qty}</td>
    <td class="amount">${rate.toFixed(2)}</td>
    <td class="amount">${amount.toFixed(2)}</td>
  `;

  // RESET FOR NEXT ITEM
  selectedItem = null;
  searchInput.value = "";
  itemQty.value = 1;
  itemRate.value = "";
}

/* =====================
   SAVE SALE
===================== */
function addSale() {
  if (!saleDate.value || !customer.value || items.length === 0) {
    alert("Complete invoice details first");
    return;
  }

  fetch(API_BASE_URL + "/sales/save", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      date: saleDate.value,
      customer: customer.value,
      invoiceNo: invoiceNo.value,
      items
    })
  })
  .then(res => res.json())
  .then(data => {
    alert("Invoice saved");
    window.open(API_BASE_URL + data.pdf, "_blank");
    location.reload();
  })
  .catch(() => alert("Error saving invoice"));
}
</script>

</body>
</html>
