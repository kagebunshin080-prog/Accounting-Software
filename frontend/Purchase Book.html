<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<script src="config.js"></script>
<title>Purchase Book</title>

<style>
@page { margin: 20mm; }

body {
  font-family: "Times New Roman", serif;
  font-size: 14px;
}

.title {
  text-align: center;
  font-weight: bold;
  font-size: 18px;
  margin-bottom: 10px;
}

.section-box {
  border: 1px solid black;
  padding: 10px;
  margin-bottom: 12px;
}

.section-title {
  font-weight: bold;
  margin-bottom: 6px;
  text-decoration: underline;
}

label {
  margin-right: 15px;
}

input {
  padding: 4px;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 8px;
}

th, td {
  border: 1px solid black;
  padding: 6px;
}

th {
  background: #f2f2f2;
}

.center { text-align: center; }
.amount { text-align: right; }

#suggestions {
  border: 1px solid #aaa;
  max-height: 150px;
  overflow-y: auto;
  position: absolute;
  background: white;
  z-index: 10;
}
#suggestions div:hover {
  background: #eee;
}
</style>
</head>

<body>

<div class="title">Purchase Book</div>

<!-- 1️⃣ PURCHASE HEADER -->
<div class="section-box">
  <div class="section-title">Purchase Details</div>

  <label>Date:
    <input type="date" id="purchaseDate">
  </label>

  <label>Supplier:
    <input type="text" id="supplier" placeholder="Supplier Name">
  </label>

  <label>Invoice No:
    <input type="text" id="invoiceNo" placeholder="PINV-0001">
  </label>
</div>

<!-- 2️⃣ ADD ITEM -->
<div class="section-box">
  <div class="section-title">Add Item</div>

  <label>Item:
    <input type="text" id="itemSearch" placeholder="Search item">
    <div id="suggestions"></div>
  </label>

  <label>Qty:
    <input type="number" id="itemQty" value="1">
  </label>

  <label>Rate ₹:
    <input type="number" id="itemRate" step="0.01">
  </label>

  <button onclick="addItem()">Add Item</button>
</div>

<!-- 3️⃣ ITEMS LIST -->
<div class="section-box">
  <div class="section-title">Items</div>

  <table id="itemsTable">
    <tr>
      <th>Item</th>
      <th>Qty</th>
      <th>Rate</th>
      <th>Amount</th>
    </tr>
  </table>
</div>

<!-- 4️⃣ SAVE -->
<div class="section-box">
  <button onclick="savePurchase()">Save Purchase</button>
</div>

<script>
let items = [];
let selectedItem = null;

const itemSearch = document.getElementById("itemSearch");
const suggestionsBox = document.getElementById("suggestions");

/* 🔍 ITEM AUTOCOMPLETE */
itemSearch.addEventListener("input", async () => {
  selectedItem = null;
  const q = itemSearch.value.trim();

  if (q.length < 2) {
    suggestionsBox.innerHTML = "";
    return;
  }

  const res = await fetch(API_BASE_URL + `/items/search?q=${q}`);
  const list = await res.json();

  suggestionsBox.innerHTML = "";
  list.forEach(item => {
    const div = document.createElement("div");
    div.textContent = `${item.item_name} (₹${item.selling_price})`;
    div.style.padding = "4px";
    div.style.cursor = "pointer";

    div.onclick = () => {
      selectedItem = item;
      itemSearch.value = item.item_name;
      itemRate.value = item.selling_price || "";
      suggestionsBox.innerHTML = "";
    };

    suggestionsBox.appendChild(div);
  });
});

/* ➕ ADD ITEM */
function addItem() {
  const name = itemSearch.value.trim();
  const qty = Number(itemQty.value);
  const rate = Number(itemRate.value);

  if (!name) {
    alert("Item name required");
    return;
  }
  if (qty <= 0 || rate <= 0) {
    alert("Invalid qty or rate");
    return;
  }

  const amount = qty * rate;

  items.push({
    item_id: selectedItem ? selectedItem.id : null,
    item_name: name,
    qty,
    rate,
    amount
  });

  const row = itemsTable.insertRow();
  row.innerHTML = `
    <td>${name}</td>
    <td class="center">${qty}</td>
    <td class="amount">${rate.toFixed(2)}</td>
    <td class="amount">${amount.toFixed(2)}</td>
  `;

  selectedItem = null;
  itemSearch.value = "";
  itemQty.value = 1;
  itemRate.value = "";
}

/* 💾 SAVE PURCHASE */
function savePurchase() {
  const date = purchaseDate.value;
  const supplier = document.getElementById("supplier").value.trim();
  const invoiceNo = document.getElementById("invoiceNo").value.trim();

  if (!date || !supplier || !invoiceNo) {
    alert("Date, supplier and invoice no required");
    return;
  }

  if (items.length === 0) {
    alert("Add at least one item");
    return;
  }

  fetch(API_BASE_URL + "/purchase/save", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      date,
      supplier,
      invoiceNo,
      items
    })
  })
  .then(res => res.json())
  .then(data => {
    if (data.error) {
      alert(data.error);
      return;
    }

    alert("Purchase saved successfully");

    // reset
    items = [];
    itemsTable.innerHTML = `
      <tr>
        <th>Item</th>
        <th>Qty</th>
        <th>Rate</th>
        <th>Amount</th>
      </tr>
    `;
    purchaseDate.value = "";
    supplier.value = "";
    invoiceNo.value = "";
  })
  .catch(() => alert("Error saving purchase"));
}
</script>

</body>
</html>
